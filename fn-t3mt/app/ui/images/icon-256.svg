<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg256)" filter="url(#shadow)"/>
  <!-- 下载箭头 -->
  <path d="M128 56 L128 152" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <path d="M88 120 L128 168 L168 120" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 底部横线 -->
  <path d="M72 192 L184 192" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- T3MT文字 -->
  <text x="128" y="230" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">T3MT</text>
</svg>
