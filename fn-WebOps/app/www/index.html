<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebServer Panel</title>
  <link rel="stylesheet" href="layui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">
  
  <div class="layui-side">
    <div class="layui-side-scroll">
      <!-- Logo Area -->
      <div style="padding: 24px 20px 20px 20px; font-size: 22px; font-weight: 800; color: var(--primary-blue); letter-spacing: -0.5px;">
          WebServer
      </div>

      <ul class="layui-nav layui-nav-tree" lay-filter="nav-menu">
        <li class="layui-nav-item layui-this"><a href="javascript:;" data-id="system"><i class="layui-icon layui-icon-home" style="margin-right: 10px;"></i> 概览</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-id="sites"><i class="layui-icon layui-icon-website" style="margin-right: 10px;"></i> 网站管理</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-id="plugins"><i class="layui-icon layui-icon-component" style="margin-right: 10px;"></i> 扩展中心</a></li>
        <li class="layui-nav-item"><a href="javascript:;" data-id="settings"><i class="layui-icon layui-icon-set" style="margin-right: 10px;"></i> 系统设置</a></li>
      </ul>

      <div style="position: absolute; bottom: 25px; left: 0; width: 100%; padding: 0 20px; box-sizing: border-box;">
         <hr style="border: none; border-top: 1px solid rgba(0,0,0,0.05); margin-bottom: 15px;">
         <a href="javascript:;" style="color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 8px;">
            <i class="layui-icon layui-icon-help"></i> 帮助中心
         </a>
      </div>
    </div>
  </div>
  
  <div class="layui-body">
    <div style="padding: 25px; min-height: 100%; display: flex; flex-direction: column; box-sizing: border-box;">
      
      <!-- Removed Breadcrumb Header -->
      
      <!-- View: System Environment -->
      <div id="view-system" class="layui-anim layui-anim-fadein" style="flex: 1;">
        <div class="native-banner">
            <h1>WebServer</h1>
            <p>飞牛原生 Web 服务中心 · 极简配置 · 高效稳定</p>
        </div>

        <!-- Hero Statistic Part -->
        <div class="layui-row layui-col-space20" style="margin-top: 10px;">
          <div class="layui-col-md12">
            <div class="layui-card" style="text-align: center; padding: 40px 0; border-radius: 20px !important;">
              <div style="font-size: 16px; color: var(--text-secondary); margin-bottom: 10px;">已安装网站总数</div>
              <div id="site-count-hero" style="font-size: 64px; font-weight: 800; color: var(--primary-blue);">0</div>
            </div>
          </div>
        </div>

        <!-- Detailed Status Part -->
        <div class="layui-row layui-col-space20">
          <div class="layui-col-md4">
            <div class="layui-card">
              <div class="layui-card-header">Nginx 服务状态</div>
              <div class="layui-card-body" id="nginx-status">
                <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> 检测中...
              </div>
            </div>
          </div>
          <div class="layui-col-md4">
            <div class="layui-card">
              <div class="layui-card-header">PHP 引擎状态</div>
              <div class="layui-card-body" id="php-status">
                <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> 检测中...
              </div>
            </div>
          </div>
          <div class="layui-col-md4">
            <div class="layui-card">
              <div class="layui-card-header">数据库服务状态</div>
              <div class="layui-card-body" id="db-status">
                <i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i> 检测中...
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- View: Site List -->
      <div id="view-sites" class="layui-anim layui-anim-fadein" style="display:none; flex: 1;">
        <div class="layui-card" style="flex: 1; display: flex; flex-direction: column; margin-bottom: 0;">
          <div class="layui-card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <span>已部署网站</span>
              <span class="layui-badge layui-bg-gray" style="margin-left: 8px; font-weight: normal;" id="site-count">0</span>
            </div>
            <!-- Search Filter for Sites -->
            <div style="width: 220px;">
              <input type="text" id="search-sites" placeholder="搜索名称或域名..." class="layui-input" style="height: 32px !important; line-height: 32px !important;">
            </div>
          </div>
          <div class="layui-card-body" style="flex: 1; display: flex; flex-direction: column; padding-top: 15px !important;">
            <div class="layui-btn-container" style="margin-bottom: 15px;">
              <button class="layui-btn layui-btn-normal" id="btn-create-site"><i class="layui-icon layui-icon-add-1"></i> 新建网站</button>
              <button class="layui-btn layui-btn-primary" id="btn-refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
            </div>
            <div style="flex: 1; min-height: 200px;">
                <table id="site-table" lay-filter="site-table"></table>
            </div>
          </div>
        </div>
      </div>

      <!-- View: Plugin Management -->
      <div id="view-plugins" class="layui-anim layui-anim-fadein" style="display:none; flex: 1;">
        <div class="layui-card" style="flex: 1; display: flex; flex-direction: column; margin-bottom: 0;">
          <div class="layui-card-header" style="display: flex; justify-content: space-between; align-items: center;">
             <span>扩展与工具管理</span>
             <!-- Search Filter for Plugins -->
             <div style="width: 220px;">
               <input type="text" id="search-plugins" placeholder="快速查找扩展..." class="layui-input" style="height: 32px !important; line-height: 32px !important;">
             </div>
          </div>
          <div class="layui-card-body" style="flex: 1; display: flex; flex-direction: column; padding-top: 15px !important;">
            <div style="margin-bottom: 15px; display:flex; gap:10px; align-items: center;">
              <input type="text" id="input-plugin-custom" placeholder="输入 apt 软件包名称" class="layui-input" style="width: 250px;">
              <button class="layui-btn layui-btn-normal" id="btn-install-custom-plugin">手动安装</button>
              <div style="flex: 1;"></div>
              <button class="layui-btn layui-btn-primary" id="btn-install-all-plugins">安装推荐集</button>
            </div>
            <div style="flex: 1; min-height: 200px;">
              <table id="plugin-table" lay-filter="plugin-table"></table>
            </div>
          </div>
        </div>
      </div>

      <!-- View: General Settings -->
      <div id="view-settings" class="layui-anim layui-anim-fadein" style="display:none; flex: 1;">
        <div class="layui-card">
          <div class="layui-card-header">基础参数配置</div>
          <div class="layui-card-body">
             <form class="layui-form" lay-filter="form-settings" style="max-width: 650px;">
              <div class="layui-form-item">
                 <blockquote class="layui-elem-quote layui-quote-nm" style="font-size:13px; color: #777; border-radius: 12px; background: #fafafa;">此操作将同步调整 PHP (post_max_size) 与 Nginx (client_max_body_size) 的限制。</blockquote>
              </div>
              <div class="layui-form-item" style="margin-top: 20px;">
                <label class="layui-form-label" style="width: 100px;">最大上传大小</label>
                <div class="layui-input-block" style="margin-left: 120px;">
                  <div style="display:flex; gap:12px;">
                    <input type="text" name="upload_limit" id="input-upload-limit" placeholder="例如: 1024M" class="layui-input">
                    <button type="button" class="layui-btn layui-btn-normal" id="btn-save-upload-limit">保存配置</button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="layui-card">
          <div class="layui-card-header">进阶维护操作</div>
          <div class="layui-card-body">
            <div style="display: flex; align-items: center; justify-content: space-between; max-width: 650px; background: #fff5f5; padding: 15px; border-radius: 12px; border: 1px solid #ffe3e3;">
               <div style="color: #e03131; font-size: 14px;">
                  <i class="layui-icon layui-icon-tips"></i> 重启 Nginx 服务可能会导致现有连接瞬时中断。
               </div>
               <button type="button" class="layui-btn" id="btn-restart-nginx" style="background: #fa5252;">立即重启</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Template: Operation Bar -->
<script type="text/html" id="site-bar">
  <div class="layui-btn-group">
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="fix-permissions">权限修复</a>
    {{# if(d.enabled){ }}
    <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="disable">停用</a>
    {{# } else { }}
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="enable">启用</a>
    {{# } }}
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">移除</a>
  </div>
</script>

<!-- Modals and scripts follow same functional pattern -->
<div id="tpl-create-site" style="display:none; padding:25px;"></div>
<div id="tpl-edit-port" style="display:none; padding:25px;"></div>
<div id="tpl-dir-selector" style="display:none; padding:15px; display:flex; flex-direction:column; height: 380px;"></div>

<script src="layui.js"></script>
<script src="script.js"></script>
</body>
</html>
