<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nginx 管理器 - fnOS</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="layui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layui-bg-gray" style="padding: 30px; min-height: 100vh;">
    <div class="layui-row layui-col-space15">
        <!-- 侧边栏/概览 -->
        <div class="layui-col-md3">
            <div class="layui-card">
                <div class="layui-card-header">服务概览</div>
                <div class="layui-card-body">
                    <div style="text-align: center; padding: 20px 0;">
                        <!-- 使用图片替代已失效的字体图标 i 标签 -->
                        <img src="icon.png" style="width: 64px; height: 64px; margin-bottom: 10px;">
                        <h2 id="nginx-status-text" style="margin-top: 10px;">检测中...</h2>
                        <p id="nginx-version" style="color: #999;">-</p>
                    </div>
                    <hr>
                    <div id="service-controls" style="display: none;">
                        <button class="layui-btn layui-btn-fluid layui-btn-normal" id="btn-start">启动服务</button>
                        <button class="layui-btn layui-btn-fluid layui-btn-danger" id="btn-stop" style="margin-top: 10px;">停止服务</button>
                        <button class="layui-btn layui-btn-fluid layui-btn-primary" id="btn-restart" style="margin-top: 10px;">重新启动</button>
                        <button class="layui-btn layui-btn-fluid layui-btn-warm" id="btn-reload" style="margin-top: 10px;">热重载配置</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 主面板 -->
        <div class="layui-col-md9">
            <div class="layui-card">
                <div class="layui-card-header">运行日志 / 错误流</div>
                <div class="layui-card-body">
                    <div style="background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 4px; font-family: monospace; height: 400px; overflow-y: auto;">
                        <pre id="nginx-logs" style="white-space: pre-wrap; word-break: break-all; margin: 0;">等待加载日志...</pre>
                    </div>
                    <div style="margin-top: 15px; text-align: right;">
                        <button class="layui-btn layui-btn-sm layui-btn-primary" id="btn-check-config">配置语法检测</button>
                        <button class="layui-btn layui-btn-sm layui-btn-primary" onclick="loadLogs()">刷新实时日志</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="layui.js"></script>
<script src="script.js"></script>
</body>
</html>
