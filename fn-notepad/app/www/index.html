<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便签记事本 - notepad</title>
    <link rel="stylesheet" href="style.css">
    <script src="lucide.min.js"></script>
    <script src="marked.min.js"></script>
</head>

<body class="app-loading">
    <aside class="sidebar">
        <div class="sidebar-header">
            <i data-lucide="sticky-note"></i>
            <span data-i18n="app_title">便签记事本</span>
        </div>
        <nav>
            <div class="nav-item active" onclick="filterNotes('all', event)">
                <i data-lucide="layout-grid"></i>
                <span data-i18n="nav_all">全部便签</span>
            </div>
            <div class="nav-item" onclick="filterNotes('pinned', event)">
                <i data-lucide="pin"></i>
                <span data-i18n="nav_pinned">已置顶</span>
            </div>
            <div class="nav-item" onclick="filterNotes('reminder', event)">
                <i data-lucide="bell"></i>
                <span data-i18n="nav_reminder">提醒事项</span>
            </div>
            <div class="nav-item" onclick="filterNotes('calendar', event)">
                <i data-lucide="calendar"></i>
                <span data-i18n="nav_timeline">时间轴</span>
            </div>
        </nav>
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <div class="nav-item" onclick="filterNotes('settings', event)">
                <i data-lucide="settings"></i>
                <span data-i18n="nav_settings">设置</span>
            </div>
            <div id="logoutNavItem" class="nav-item" onclick="performLogout()" style="display: none; color: #f44336;">
                <i data-lucide="log-out"></i>
                <span data-i18n="nav_logout">退出登录</span>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="search-bar">
                <i data-lucide="search" style="width:18px; opacity:0.5;"></i>
                <input type="text" data-i18n="search_placeholder" placeholder="搜索便签..." id="searchInput">
            </div>
            <div class="user-actions">
                <button id="batchSelectBtn" class="btn-icon-text" onclick="toggleBatchMode()">
                    <i data-lucide="check-square"></i>
                    <span data-i18n="btn_batch">批量选择</span>
                </button>
            </div>
        </header>

        <!-- New Selection Bar -->
        <div id="selectionBar" class="selection-overlay">
            <div class="selection-info">
                <button class="btn-icon" onclick="toggleBatchMode()" data-i18n="btn_exit_batch" title="退出选择">
                    <i data-lucide="x"></i>
                </button>
                <span id="selectionCountText">已选中 0 项</span>
            </div>
            <div class="selection-actions">
                <button id="selectAllBtn" class="btn-glass" onclick="toggleSelectAll()">
                    <i data-lucide="list-checks"></i>
                    <span id="selectAllText">全选</span>
                </button>
                <button class="btn-glass btn-danger-glass" onclick="deleteSelected()">
                    <i data-lucide="trash-2"></i>
                    <span data-i18n="btn_delete_selected">删除</span>
                </button>
            </div>
        </div>

        <section class="notes-grid" id="notesGrid">
            <!-- Notes will be injected here -->
        </section>

        <section id="settingsPanel" style="display:none; padding: 40px; width: 100%; overflow-y: auto; flex: 1;">
            <h2 data-i18n="settings_title" style="margin-bottom: 30px;">设置</h2>

            <div class="setting-item"
                style="margin-bottom: 40px; background: var(--card-bg); padding: 20px; border-radius: 12px; backdrop-filter: var(--blur);">
                <h3 data-i18n="language_title" style="margin-bottom: 15px; font-size: 18px;">语言设置 (Language)</h3>
                <select id="langSelect"
                    style="padding: 8px 15px; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); outline: none;"
                    onchange="changeLanguage(this.value)">
                    <option value="zh">简体中文</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div id="externalAccessSection" class="setting-item"
                style="margin-bottom: 30px; background: var(--card-bg); padding: 25px; border-radius: 16px; backdrop-filter: var(--blur); border: 1px solid var(--glass-border);">
                <h3 data-i18n="external_access_title" style="margin-bottom: 10px; font-size: 18px;">外部访问</h3>
                <p data-i18n="external_access_desc" style="opacity: 0.6; margin-bottom: 20px; font-size: 14px;">
                    允许通过特定端口从局域网或公网访问便签。</p>
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span data-i18n="external_access_enable">启用外部访问</span>
                        <label class="switch">
                            <input type="checkbox" id="externalAccessToggle" onchange="saveExternalSettings()">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div id="portSettings"
                        style="display: flex; align-items: center; justify-content: space-between; padding-top: 15px; border-top: 1px solid var(--border-color);">
                        <span data-i18n="external_access_port">访问端口</span>
                        <input type="number" id="externalAccessPort" value="8080" min="1" max="65535"
                            onchange="saveExternalSettings()"
                            style="width: 120px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); outline: none;">
                    </div>
                    <div id="authSettings"
                        style="display: flex; flex-direction: column; gap: 15px; padding-top: 15px; border-top: 1px solid var(--border-color);">
                        <div style="display: flex; align-items: center; justify-content: space-between;">
                            <span data-i18n="external_access_user">访问账号</span>
                            <input type="text" id="externalAccessUser" placeholder="用户名 (可选)"
                                onchange="saveExternalSettings()"
                                style="width: 150px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); outline: none;">
                        </div>
                        <div style="display: flex; align-items: center; justify-content: space-between;">
                            <span data-i18n="external_access_pass">访问密码</span>
                            <input type="password" id="externalAccessPass" placeholder="密码 (可选)"
                                onchange="saveExternalSettings()"
                                style="width: 150px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); outline: none;">
                        </div>
                    </div>
                </div>
            </div>

            <div id="backupSection" class="setting-item"
                style="margin-bottom: 30px; background: var(--card-bg); padding: 25px; border-radius: 16px; backdrop-filter: var(--blur); border: 1px solid var(--glass-border);">
                <h3 data-i18n="backup_title" style="margin-bottom: 10px; font-size: 18px;">数据管理</h3>
                <p data-i18n="backup_desc" style="opacity: 0.6; margin-bottom: 25px; font-size: 14px;">
                    您可以手动导出所有便签数据进行备份，或从备份文件中恢复。</p>
                <div style="display: flex; gap: 15px;">
                    <button class="btn btn-primary" onclick="exportNotes()">
                        <i data-lucide="download" style="width: 18px;"></i>
                        <span data-i18n="btn_export">导出数据</span>
                    </button>
                    <button class="btn btn-outline" onclick="document.getElementById('importInput').click()">
                        <i data-lucide="upload" style="width: 18px;"></i>
                        <span data-i18n="btn_import">恢复数据</span>
                    </button>
                    <input type="file" id="importInput" style="display: none;" accept=".json"
                        onchange="importNotes(event)">
                </div>
            </div>
        </section>

        <div class="add-btn" id="addNoteBtn">
            <i data-lucide="plus"></i>
        </div>
    </main>

    <!-- Note Modal/Editor -->
    <div id="noteModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(10px); z-index:2000; justify-content:center; align-items:center;">
        <div class="modal-container"
            style="background:var(--card-bg); backdrop-filter:var(--blur); width:90%; max-width:600px; border-radius:16px; padding:30px; box-shadow:var(--shadow); position:relative; border:1px solid var(--glass-border);">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
                <input type="text" id="modalTitle" data-i18n="modal_placeholder_title" placeholder="标题"
                    style="width:90%; font-size:24px; font-weight:600; border:none; background:transparent; outline:none; color:var(--text-color);">
                <div style="display:flex; align-items:center; gap:15px;">
                    <span onclick="toggleNotePrivacy()" id="modalLockBtn"
                        style="cursor:pointer; display:flex; align-items:center; justify-content:center;">
                        <i data-lucide="lock" id="modalLock"
                            style="width:24px; height:24px; color:var(--text-color); opacity:0.3;"></i>
                    </span>
                    <span onclick="togglePin()"
                        style="cursor:pointer; display:flex; align-items:center; justify-content:center;">
                        <i data-lucide="pin" id="modalPin"
                            style="width:24px; height:24px; color:var(--text-color); opacity:0.3;"></i>
                    </span>
                </div>
            </div>
            <div class="modal-separator"></div>
            <textarea id="modalContent" data-i18n="modal_placeholder_content" placeholder="开始记录..."
                style="width:100%; height:300px; border:none; background:transparent; outline:none; font-size:16px; resize:none; color:var(--text-color);"></textarea>

            <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                <i data-lucide="bell" style="width:18px; color:var(--text-color); opacity:0.6;"></i>
                <input type="datetime-local" id="modalReminder"
                    style="background:transparent; border:1px solid var(--border-color); border-radius:4px; color:var(--text-color); padding:4px 8px; font-size:14px; outline:none;">
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
                <div class="color-picker" style="display:flex; gap:10px;">
                    <div class="color-dot color-yellow"
                        style="width:20px; height:20px; border-radius:10px; cursor:pointer;"
                        onclick="selectColor('yellow')"></div>
                    <div class="color-dot color-blue"
                        style="width:20px; height:20px; border-radius:10px; cursor:pointer;"
                        onclick="selectColor('blue')"></div>
                    <div class="color-dot color-green"
                        style="width:20px; height:20px; border-radius:10px; cursor:pointer;"
                        onclick="selectColor('green')"></div>
                    <div class="color-dot color-pink"
                        style="width:20px; height:20px; border-radius:10px; cursor:pointer;"
                        onclick="selectColor('pink')"></div>
                    <div class="color-dot color-purple"
                        style="width:20px; height:20px; border-radius:10px; cursor:pointer;"
                        onclick="selectColor('purple')"></div>
                </div>
                <div style="display:flex; gap:12px; align-items:center;">
                    <button class="btn btn-outline" onclick="closeModal()" data-i18n="modal_btn_cancel">取消</button>
                    <button class="btn btn-primary" onclick="saveNote()" data-i18n="modal_btn_save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Password Prompt Modal -->
    <div id="passwordModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(10px); z-index:3000; justify-content:center; align-items:center;">
        <div class="modal-container"
            style="background:var(--card-bg); backdrop-filter:var(--blur); width:90%; max-width:400px; border-radius:16px; padding:30px; box-shadow:var(--shadow); border:1px solid var(--glass-border);">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
                <i data-lucide="lock" style="width:24px; color:var(--primary-color);"></i>
                <h3 id="passwordModalTitle" style="font-size:18px; margin:0;">请输入卡片密码</h3>
            </div>
            <input type="password" id="notePasswordField" data-i18n="password_placeholder" placeholder="密码"
                style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-color); background:transparent; color:var(--text-color); outline:none; font-size:16px; margin-bottom:20px;">
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                <button class="btn btn-outline" onclick="closePasswordModal()" data-i18n="modal_btn_cancel">取消</button>
                <button class="btn btn-primary" id="passwordConfirmBtn" data-i18n="password_btn_confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(10px); z-index:4000; justify-content:center; align-items:center;">
        <div class="modal-container"
            style="background:var(--card-bg); backdrop-filter:var(--blur); width:90%; max-width:400px; border-radius:16px; padding:30px; box-shadow:var(--shadow); border:1px solid var(--glass-border);">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
                <div style="background:rgba(244, 67, 54, 0.1); padding:10px; border-radius:12px;">
                    <i data-lucide="alert-triangle" style="width:24px; color:#f44336;"></i>
                </div>
                <h3 id="confirmModalTitle" style="font-size:18px; margin:0;" data-i18n="confirm_title">确认操作</h3>
            </div>
            <p id="confirmModalMessage" style="opacity:0.8; line-height:1.6; margin-bottom:30px;">确定要执行此操作吗？此操作不可撤销。</p>
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                <button class="btn btn-outline" id="confirmCancelBtn" data-i18n="modal_btn_cancel">取消</button>
                <button class="btn btn-danger" id="confirmConfirmBtn" data-i18n="password_btn_confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- External Login Modal -->
    <div id="externalLoginModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); backdrop-filter:blur(20px); z-index:5000; justify-content:center; align-items:center;">
        <div class="modal-container"
            style="background:var(--card-bg); backdrop-filter:var(--blur); width:90%; max-width:400px; border-radius:24px; padding:40px; box-shadow:var(--shadow); border:1px solid var(--glass-border); text-align:center;">
            <div
                style="width:64px; height:64px; background:var(--primary-color); border-radius:20px; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; color:white; box-shadow:0 8px 16px rgba(0,120,212,0.3);">
                <i data-lucide="shield-check" style="width:32px; height:32px;"></i>
            </div>
            <h2 data-i18n="login_title" style="margin-bottom:8px; font-size:24px;">安全登录</h2>
            <p data-i18n="login_desc" style="opacity:0.6; margin-bottom:32px; font-size:14px;">请输入外网访问账号和密码</p>

            <div style="display:flex; flex-direction:column; gap:16px; margin-bottom:32px;">
                <div class="search-bar" style="width:100%; background:rgba(0,0,0,0.05); margin-left: 0;">
                    <i data-lucide="user" style="width:18px; opacity:0.5;"></i>
                    <input type="text" id="extLoginUser" data-i18n="login_user_placeholder" placeholder="用户名"
                        style="flex:1; border:none; background:transparent; outline:none; color:var(--text-color); padding:8px;">
                </div>
                <div class="search-bar" style="width:100%; background:rgba(0,0,0,0.05); margin-left: 0;">
                    <i data-lucide="key-round" style="width:18px; opacity:0.5;"></i>
                    <input type="password" id="extLoginPass" data-i18n="login_pass_placeholder" placeholder="密码"
                        style="flex:1; border:none; background:transparent; outline:none; color:var(--text-color); padding:8px;">
                </div>
            </div>

            <button class="btn btn-primary" onclick="performExternalLogin()"
                style="width:100%; padding:14px; font-size:16px; border-radius:12px;">
                <span data-i18n="login_btn">登录</span>
            </button>
        </div>
    </div>

    <div id="selectionBox"
        style="display:none; position:fixed; border:1px solid var(--primary-color); background:rgba(0,120,212,0.1); z-index:1000; pointer-events:none;">
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="app.js"></script>
</body>

</html>
