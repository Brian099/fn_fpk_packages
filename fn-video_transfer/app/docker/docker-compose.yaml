services:
  ffmpeg-service:
    image: brian9909/ffmpeg-docker-web-manager:latest
    container_name: ffmpeg-app
    ports:
      - "8087:8000"
    volumes:
      - ./media:/data
      - ./config:/config
      # 挂载宿主机时间
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/data
      - CONFIG_DIR=/config
      # - PUID=1000
      # - PGID=1000
    entrypoint: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: always

    # Dynamic hardware sections will be appended here
