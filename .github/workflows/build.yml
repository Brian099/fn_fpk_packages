name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Build
        run: |
          TAG=$(date +"%Y.%m.%d-%H%M")
          echo "TAG=${TAG}" >> $GITHUB_ENV

          curl -sSL https://static2.fnnas.com/fnpack/fnpack-1.0.4-linux-amd64 -o fnpack
          sudo chmod +x fnpack

          echo "| 图标 | 应用名称 | 版本 | 平台 | 大小 | 描述 |" > apps-list.md
          echo "| :---: | :--- | :--- | :--- | :--- | :--- |" >> apps-list.md

          mkdir -p metadata
          for APP in fn-*; do
            [ -f "${APP}/norelease" ] && continue
            [ -f "${APP}/manifest" ] || continue
            echo "Building ${APP} ..."

            ./fnpack build --directory ${APP}

            APPNAME=$(grep -E '^appname[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            VERSION=$(grep -E '^version[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            DESC=$(grep -E '^desc[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            PLATFORM=$(grep -E '^platform[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            [ -z "$PLATFORM" ] && PLATFORM="x86"

            mv -f "${APPNAME}.fpk" "${APPNAME}_v${VERSION}.fpk"

            ICON_URL="https://github.com/${REPO}/raw/main/${APP}/ICON.PNG"
            SIZE=$(stat -c%s "${APPNAME}_v${VERSION}.fpk" 2>/dev/null | awk '{printf "%.2f MB",$1/1024/1024}')

            echo "| <img src=\"${ICON_URL}\" width=\"48\" height=\"48\"> | ${APPNAME} | v${VERSION} | ${PLATFORM} | ${SIZE} | ${DESC} |" >> apps-list.md

            # Extract metadata for fnpack.json
            SIZE_NUM=$(stat -c%s "${APPNAME}_v${VERSION}.fpk" 2>/dev/null | awk '{printf "%.2f",$1/1024/1024}')
            NAME=$(grep -E '^display_name[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            TYPE=$(grep -E '^install_type[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            MAINTAINER=$(grep -E '^maintainer[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            MAINTAINER_URL=$(grep -E '^maintainer_url[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            DISTRIBUTOR=$(grep -E '^distributor[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            DISTRIBUTOR_URL=$(grep -E '^distributor_url[[:space:]]*=' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            [ -z "$MAINTAINER" ] && MAINTAINER="Ing"
            [ -z "$MAINTAINER_URL" ] && MAINTAINER_URL="https://github.com/${REPO}"
            LABELS="工具"
            [ -f "$APP/labels.txt" ] && LABELS=$(cat "$APP/labels.txt" | xargs)

            if [ "$TYPE" = "root" ]; then
                INSTALL_TYPE="系统空间"
            else
                INSTALL_TYPE="用户空间"
            fi
            
            # Save metadata to individual JSON
            jq -n --arg app "$APPNAME" \
                  --arg name "$NAME" \
                  --arg desc "$DESC" \
                  --arg labs "$LABELS" \
                  --arg ver "V${VERSION}" \
                  --arg author "$MAINTAINER" \
                  --arg author_url "$MAINTAINER_URL" \
                  --arg dist "$DISTRIBUTOR" \
                  --arg dist_url "$DISTRIBUTOR_URL" \
                  --arg type "$INSTALL_TYPE" \
                  --arg size "$SIZE_NUM" \
                  --arg platform "$PLATFORM" \
                  --arg file "${APPNAME}_v${VERSION}.fpk" \
                  --arg bug "https://github.com/${REPO}/issues" \
                  '{$app: {display_name: $name, version: $ver, desc: $desc, labels: $labs, install_type: $type, size: $size, platform: $platform, author: $author, author_url: $author_url, distributor: $dist, distributor_url: $dist_url, bug_report_url: $bug, filename: $file}}' > "metadata/${APPNAME}.json"
          done

          echo "" >> apps-list.md
          echo "![](https://img.shields.io/github/downloads/${REPO}/${TAG}/total)" >> apps-list.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fn-apps
          path: "*.fpk"
          retention-days: 5

      - name: Release
        if: success() && !cancelled()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.RELEASE }}
          tag: ${{ env.TAG }}
          artifacts: "*.fpk"
          bodyFile: "apps-list.md"

      - name: Update Metadata and Push
        if: success() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching release asset URLs..."
          ASSETS_JSON=$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets')
          
          if [ ! -f fnpack.json ]; then echo "{}" > fnpack.json; fi

          for meta in metadata/*.json; do
            APPNAME=$(basename "$meta" .json)
            FILENAME=$(jq -r --arg app "$APPNAME" '.[$app].filename' "$meta")
            DL_URL=$(echo "$ASSETS_JSON" | jq -r --arg file "$FILENAME" '.[] | select(.name == $file) | .browserDownloadUrl')
            
            if [ -n "$DL_URL" ] && [ "$DL_URL" != "null" ]; then
              echo "Found URL for $APPNAME: $DL_URL"
              # 更新下载地址并移除临时文件名
              jq --arg app "$APPNAME" --arg dl "$DL_URL" '.[$app].download_url = $dl | del(.[$app].filename)' "$meta" > "${meta}.tmp" && mv "${meta}.tmp" "$meta"
              # 增量更新到主 fnpack.json
              jq -s '.[0] * .[1]' fnpack.json "$meta" > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json
            else
              echo "Warning: Download URL not found for $FILENAME"
            fi
          done

          # Update README.md
          python3 - << 'EOF'
          import os
          if os.path.exists('README.md') and os.path.exists('apps-list.md'):
              with open('README.md', 'r', encoding='utf-8') as f:
                  readme = f.read()
              with open('apps-list.md', 'r', encoding='utf-8') as f:
                  apps_list = f.read()
              start_marker = '<!-- APPS_LIST_START -->'
              end_marker = '<!-- APPS_LIST_END -->'
              if start_marker in readme and end_marker in readme:
                  parts_start = readme.split(start_marker)
                  parts_end = parts_start[1].split(end_marker)
                  new_readme = parts_start[0] + start_marker + '\n' + apps_list + '\n' + end_marker + parts_end[1]
                  with open('README.md', 'w', encoding='utf-8') as f:
                      f.write(new_readme)
          EOF

          # Commit and Push
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git pull
          status=$(git status -s | grep -E "fnpack.json|README.md" | awk '{printf " %s", $2}')
          if [ -n "${status}" ]; then
            git add ${status}
            git commit -m "update metadata and readme $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi

      - name: Upload to FnDepot Repository
        if: success() && !cancelled()
        run: |
          echo "Uploading to FnDepot repository..."
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git clone "https://${{ secrets.RELEASE }}@github.com/Brian099/FnDepot.git" fndepot-repo
          cd fndepot-repo
          
          # 同步图标
          for meta in ../metadata/*.json; do
            APPNAME=$(basename "$meta" .json)
            SOURCE_DIR="../fn-$APPNAME"
            if [ ! -d "$SOURCE_DIR" ]; then
              for DIR in ../fn-*; do
                if [ -f "$DIR/manifest" ] && grep -q "^appname.*=.*$APPNAME" "$DIR/manifest"; then
                  SOURCE_DIR="$DIR"
                  break
                fi
              done
            fi
            
            mkdir -p "$APPNAME"
            if [ -f "$SOURCE_DIR/ICON.PNG" ]; then
              cp "$SOURCE_DIR/ICON.PNG" "$APPNAME/ICON.PNG"
            fi
          done
          
          # 更新 FnDepot 的 fnpack.json (增量合并)
          jq -s '.[0] * .[1]' fnpack.json ../fnpack.json > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update from ${{ github.repository }} - ${{ env.TAG }}"
            git push origin main
          fi
