name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Init Env
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Build
        run: |
          REPO="${{ github.repository }}"
          TAG=$(date +"%Y.%m.%d-%H%M")
          echo "TAG=${TAG}" >> $GITHUB_ENV

          curl -sSL https://static2.fnnas.com/fnpack/fnpack-1.0.4-linux-amd64 -o fnpack
          sudo chmod +x fnpack

          echo "| 图标 | 应用名称 | 版本 | 平台 | 大小 | 描述 |" > apps-list.md
          echo "| :---: | :--- | :--- | :--- | :--- | :--- |" >> apps-list.md

          APPS=()
          for APP in fn-*; do
            [ -f "${APP}/norelease" ] && continue
            [ -f "${APP}/manifest" ] || continue
            echo "Building ${APP} ..."

            # ./fnpack create ${APP} --without-ui true  # 如果不需要 UI, 可以启用此行
            ./fnpack build --directory ${APP}

            ICON_URL="https://github.com/${REPO}/raw/main/${APP}/ICON.PNG"
            SIZE=$(stat -c%s "${APPNAME}_v${VERSION}.fpk" 2>/dev/null | awk '{printf "%.2f MB",$1/1024/1024}')

            echo "| <img src=\"${ICON_URL}\" width=\"48\" height=\"48\"> | ${APPNAME} | v${VERSION} | ${PLATFORM} | ${SIZE} | ${DESC} |" >> apps-list.md

            mv -f "${APPNAME}.fpk" "${APPNAME}_v${VERSION}.fpk"

            SIZE=$(stat -c%s "${APPNAME}_v${VERSION}.fpk" 2>/dev/null | awk '{printf "%10.3f",$1/1024/1024}')
            NAME=$(grep '^display_name' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            TYPE=$(grep '^install_type' "$APP/manifest" | awk -F= '{print $2}' | xargs)
            APPS+=("\"${APP}\": {\"display_name\": \"${NAME}\", \"desc\": \"${DESC}\", \"labels\": \"工具\", \"version\": \"${VERSION}\", \"download_url\": \"https://github.com/${REPO}/releases/download/${TAG}/${APPNAME}_v${VERSION}.fpk\", \"author\": \"Ing\", \"author_url\": \"https://github.com/${REPO}\", \"bug_report_url\": \"https://github.com/${REPO}/issues\", \"install_type\": \"${TYPE}\", \"size\": \"${SIZE}\", \"history\": {\"v${VERSION}\": \"Initial release of ${APPNAME} package.\"}}")
          done

          echo "" >> apps-list.md
          echo "![](https://img.shields.io/github/downloads/${REPO}/${TAG}/total)" >> apps-list.md

          if ! command -v jq >/dev/null 2>&1; then
            sudo apt update >/dev/null 2>&1 && sudo apt install -y jq >/dev/null 2>&1
          fi
          echo {$(IFS=,; echo "${APPS[*]}")} | jq . >fnpack.json

          # Update README.md
          python3 -c "
import os
if os.path.exists('README.md') and os.path.exists('apps-list.md'):
    with open('README.md', 'r', encoding='utf-8') as f:
        readme = f.read()
    with open('apps-list.md', 'r', encoding='utf-8') as f:
        apps_list = f.read()
    start_marker = '<!-- APPS_LIST_START -->'
    end_marker = '<!-- APPS_LIST_END -->'
    if start_marker in readme and end_marker in readme:
        parts_start = readme.split(start_marker)
        parts_end = parts_start[1].split(end_marker)
        new_readme = parts_start[0] + start_marker + '\n' + apps_list + '\n' + end_marker + parts_end[1]
        with open('README.md', 'w', encoding='utf-8') as f:
            f.write(new_readme)
"

      - name: Check and Push
        if: success()
        run: |
          echo "Git push ..."
          # git checkout main
          git pull
          status=$(git status -s | grep -E "fnpack.json|README.md" | awk '{printf " %s", $2}')
          if [ -n "${status}" ]; then
            git add ${status}
            git commit -m "update $(date '+%Y-%m-%d %H:%M:%S')"
            git push -f
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fn-apps
          path: "*.fpk"
          retention-days: 5

      - name: Release
        if: success() && !cancelled()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.RELEASE }}
          tag: ${{ env.TAG }}
          artifacts: "*.fpk"
          bodyFile: "apps-list.md"

      - name: Upload to FnDepot Repository
        if: success() && !cancelled()
        run: |
          echo "Uploading fpk files to FnDepot repository..."

          # 设置 Git 配置
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # 克隆目标仓库（使用 RELEASE token）
          git clone "https://${{ secrets.RELEASE }}@github.com/${{ github.actor }}/FnDepot.git" fndepot-repo
          cd fndepot-repo

          # 处理每个 fpk 文件
          for FPK_FILE in ../*.fpk; do
            if [ -f "$FPK_FILE" ]; then
              # 从文件名提取应用名称和版本号
              # 支持两种格式：webops_v1.0.0.fpk 和 webops-v1.0.0.fpk
              BASENAME=$(basename "$FPK_FILE" .fpk)
              APPNAME="$BASENAME"
              VERSION=""

              if [[ "$BASENAME" =~ ^(.+)_v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                APPNAME="${BASH_REMATCH[1]}"
                VERSION="${BASH_REMATCH[2]}"
              elif [[ "$BASENAME" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                APPNAME="${BASH_REMATCH[1]}"
                VERSION="${BASH_REMATCH[2]}"
              fi

              echo "Processing: $BASENAME.fpk -> $APPNAME/$APPNAME.fpk"

              # 创建应用目录（如果不存在）
              mkdir -p "$APPNAME"

              # 复制文件到目标目录并重命名为 appname.fpk
              cp "$FPK_FILE" "$APPNAME/$APPNAME.fpk"

              echo "Copied $BASENAME.fpk to $APPNAME/$APPNAME.fpk"

                  # 寻找源目录以获取更多信息
                  SOURCE_DIR="../fn-$APPNAME"
                  if [ ! -d "$SOURCE_DIR" ]; then
                    for DIR in ../fn-*; do
                      if [ -f "$DIR/manifest" ] && grep -q "^appname.*=.*$APPNAME" "$DIR/manifest"; then
                        SOURCE_DIR="$DIR"
                        break
                      fi
                    done
                  fi

                  # 提取元数据
                  MANIFEST="$SOURCE_DIR/manifest"
                  DISPLAY_NAME=$(grep '^display_name' "$MANIFEST" | awk -F= '{print $2}' | xargs)
                  DESC=$(grep '^desc' "$MANIFEST" | awk -F= '{print $2}' | xargs)
                  MAINTAINER=$(grep '^maintainer' "$MANIFEST" | awk -F= '{print $2}' | xargs)
                  MAINTAINER_URL=$(grep '^maintainer_url' "$MANIFEST" | awk -F= '{print $2}' | xargs)
                  DISTRIBUTOR=$(grep '^distributor' "$MANIFEST" | awk -F= '{print $2}' | xargs)
                  DISTRIBUTOR_URL=$(grep '^distributor_url' "$MANIFEST" | awk -F= '{print $2}' | xargs)
                  RAW_TYPE=$(grep '^install_type' "$MANIFEST" | awk -F= '{print $2}' | xargs)
                  PLATFORM=$(grep '^platform' "$MANIFEST" | awk -F= '{print $2}' | xargs)
                  [ -z "$PLATFORM" ] && PLATFORM="x86"
                  
                  if [ "$RAW_TYPE" = "root" ]; then
                      INSTALL_TYPE="系统空间"
                  else
                      INSTALL_TYPE="用户空间"
                  fi
                  
                  SIZE=$(stat -c%s "$FPK_FILE" | awk '{printf "%.2f",$1/1024/1024}')

                  # 同步图标
                  if [ -f "$SOURCE_DIR/ICON.PNG" ]; then
                    cp "$SOURCE_DIR/ICON.PNG" "$APPNAME/ICON.PNG"
                    echo "Copied ICON.PNG for $APPNAME"
                  fi

                  # 同步更新根目录 fnpack.json 中多个字段
                  if jq -e --arg app "$APPNAME" 'has($app)' fnpack.json >/dev/null; then
                    jq --arg app "$APPNAME" \
                       --arg name "$DISPLAY_NAME" \
                       --arg ver "V${VERSION}" \
                       --arg desc "$DESC" \
                       --arg type "$INSTALL_TYPE" \
                       --arg size "$SIZE" \
                       --arg author "$MAINTAINER" \
                       --arg author_url "$MAINTAINER_URL" \
                       --arg dist "$DISTRIBUTOR" \
                       --arg dist_url "$DISTRIBUTOR_URL" \
                       --arg plat "$PLATFORM" \
                       '.[$app].display_name = $name | .[$app].version = $ver | .[$app].desc = $desc | .[$app].install_type = $type | .[$app].size = $size | .[$app].author = $author | .[$app].author_url = $author_url | .[$app].distributor = $dist | .[$app].distributor_url = $dist_url | .[$app].platform = $plat' \
                       fnpack.json > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json
                    echo "Updated fnpack.json metadata for $APPNAME"
                  else
                    echo "Warning: app key '$APPNAME' not found in fnpack.json, skipping metadata update"
                  fi
            fi
          done

          # 提交并推送到目标仓库
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Update fpk files from ${{ github.repository }} - ${{ env.TAG }}"
            git push origin main
            echo "Successfully uploaded to FnDepot repository"
          fi
